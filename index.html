    return{R:R,dims:[{k:"vq",f:"Qty",t:"Quantity",num:1,fmt:function(v){return v+" cards"}},{k:"vf",f:"Finish",t:"Finish"},{k:"vs",f:"Side",t:"Side",seg:1,fmt:function(v){return SIDE[v]}},{k:"vp",f:"Paper",t:"Paper (optional)",opt:1,fmt:plab}]}}
  if(S.tab=="Envelope")return{R:(DB.Envelope||[]).map(function(r){return{Size:r.Size,Paper:r.Paper,Rate:r.Rate}}).filter(function(r){return r.Rate!=null}),dims:[{k:"es",f:"Size",t:"Size"}]};
  return{R:(DB.Letterhead||[]).map(function(r){return{Size:r.Size,Side:r.Side,Qty:String(r.Qty),Paper:r.Paper,Rate:r.Rate}}).filter(function(r){return r.Rate!=null}),
    dims:[{k:"ls",f:"Size",t:"Size"},{k:"lsd",f:"Side",t:"Side",seg:1},{k:"lq",f:"Qty",t:"Quantity",num:1,fmt:function(v){return v+" pcs"}}]}}
function match(R,dims,skip){return R.filter(function(r){return dims.every(function(d){return d===skip||!S[d.k]||String(r[d.f])===S[d.k]})})}
function enabled(R,dims,d){return uniq(match(R,dims,d).map(function(r){return String(r[d.f])}))}
function ensure(M){for(var p=0;p<3;p++)M.dims.forEach(function(d){var ok=enabled(M.R,M.dims,d);if(d.opt){if(S[d.k]&&ok.indexOf(S[d.k])<0)S[d.k]="";return}if(ok.indexOf(S[d.k])<0)S[d.k]=ok[0]||""})}
function opts(M,d){var o=uniq(M.R.map(function(r){return String(r[d.f])}));return d.num?o.sort(function(a,b){return a-b}):o}
function why(M,k,v){var d=M.dims.filter(function(x){return x.k==k})[0],rs=M.R.filter(function(r){return String(r[d.f])===v}),ps=[];
  M.dims.forEach(function(e){if(e===d||e.opt)return;var all=opts(M,e),got=uniq(rs.map(function(r){return String(r[e.f])}));if(got.length<all.length)ps.push(e.t.replace(" (optional)","")+": "+got.map(function(g){return e.fmt?e.fmt(g):g}).join(", "))});
  return (d.fmt?d.fmt(v):v)+" sirf "+(ps.join(" | ")||"is selection")+" par milta hai"}
var FOPEN=false;
function filters(M){
  var h='<div class="fh"><div class="fl"><b>Select options</b><span class="fsum" id="fsum"></span></div><div class="fa"><button class="reset" data-k="reset">Reset</button><button class="ftog" data-k="ftog">'+(FOPEN?'Done ▴':'Change ▾')+'</button></div></div><div class="fbody">';
  M.dims.forEach(function(d){var en=enabled(M.R,M.dims,d),o=opts(M,d),fm=d.fmt||function(v){return v};
    var btn=function(v,lab){var on=S[d.k]===v,off=en.indexOf(v)<0&&v!=="";return '<button class="'+(d.seg?'':'chip')+(on?' on':'')+(off?' off':'')+'" data-k="'+d.k+'" data-v="'+esc(v)+'">'+esc(lab)+'</button>'};
    h+='<div class="g"><div class="lb">'+d.t+'</div><div class="'+(d.seg?'seg':'chips')+'" data-r="'+d.k+'">'+(d.opt?btn("","All papers"):"")+o.map(function(v){return btn(v,d.num?v:fm(v))}).join("")+'</div></div>'});
  if(S.tab=="VisitingCards"){var low=+S.vq<num("DesignBelowQty",500);
    h+='<div class="g"><div class="lb">Design</div><div class="seg"><button class="'+(S.des==="0"?'on':'')+'" data-k="des" data-v="0">Without Design</button><button class="'+(S.des==="1"?'on':'')+(low?'':' off')+'" data-k="des" data-v="1">With Design</button></div><div class="hint">'+(low?'Single side +'+inr(num("DesignSS",200))+' · Both side +'+inr(num("DesignBS",400))+' · Spot UV / Foil +'+inr(num("DesignFx",500)):'Design sirf '+num("DesignBelowQty",500)+' se kam cards par milta hai.')+'</div></div>'}
  return h+'</div>'}
function results(M){
  var rows=match(M.R,M.dims), qty=+S.vq||+S.lq||0, parts=M.dims.map(function(d){var v=S[d.k];return v?(d.fmt?d.fmt(v):v):""}).filter(Boolean);
  if(S.tab=="VisitingCards")parts=[S.vq+" cards",S.vf,SIDE[S.vs]];
  var sub=S.tab=="Envelope"?S.es+" · per 1000 envelopes":parts.join(" · ");SUB=sub+(S.des==="1"?" · with design":"")+(S.rs==="1"?" · reseller":"");
  var h='<div class="rh"><b>Rates</b><span>'+esc(SUB)+'</span></div>';
  h+=rows.map(function(r){var vcl=r.Paper.indexOf(" - ")>0,a=r.Paper.split(" - "),code=r.Paper.split(" ")[0],gs=vcl?a[1].replace("GSM"," GSM"):"",base=disc(r.Rate),dz=dsg(r),p=base+dz,nm=vcl?pn(a[0]):"";
    var title=vcl?(nm||a[0]):r.Paper,sb=(vcl&&nm?a[0]+" · ":"")+gs+(S.tab=="VisitingCards"&&qty?(gs?' · ':'')+inr(+(p/qty).toFixed(2))+' / card':'');
    return '<div class="row" style="--c:'+(COL[vcl?a[0]:code]||"#a3132b")+'"><div><b>'+esc(title)+'</b><small>'+esc(r.Sub||sb)+'</small></div><div class="pr">'+inr(p)+(r.Unit?'<small><br>'+r.Unit+'</small>':'')+(dz?'<small><br>'+inr(base)+' print + '+inr(dz)+' design</small>':'')+'</div></div>'}).join("")||'<div class="empty">Is selection ke rates available nahi hain</div>';
  $("wa").href="https://wa.me/"+(cfg().WhatsApp||"")+"?text="+encodeURIComponent("Hi, I need a quote for "+TABS[S.tab]+": "+SUB);
  return h}
function render(){
  refreshTabs();var c=cfg(),M=model();ensure(M);
  if(S.tab=="VisitingCards"&&+S.vq>=num("DesignBelowQty",500))S.des="0";
  var key=String(c.ResellerKey||"jmd");try{if(P.get("reseller")===key)localStorage.setItem("jmd_rs","1");ISRS=P.get("reseller")===key||localStorage.getItem("jmd_rs")==="1"}catch(e){ISRS=P.get("reseller")===key}
  $("rsw").style.display="inline-flex";$("rsw").className="rsw"+(S.rs==="1"?" on":"");
  $("biz").textContent=c.Business||"JMD GRAPHICS";$("tel").textContent=c.Contact||"";$("tel").href="tel:"+String(c.Contact||"").split("/")[0].replace(/\D/g,"");
  $("tabs").innerHTML=Object.keys(TABS).map(function(k){return '<button class="tab'+(k==S.tab?' on':'')+'" data-k="tab" data-v="'+k+'">'+TABS[k]+'</button>'}).join("");
  var sc={};Array.prototype.forEach.call(document.querySelectorAll?document.querySelectorAll("[data-r]"):[],function(el){sc[el.dataset.r]=el.scrollLeft});$("filters").innerHTML=filters(M);Array.prototype.forEach.call(document.querySelectorAll?document.querySelectorAll("[data-r]"):[],function(el){if(sc[el.dataset.r])el.scrollLeft=sc[el.dataset.r]});$("res").innerHTML=results(M);$("filters").className="card"+(FOPEN?"":" closed");$("fsum").textContent=SUB;
  $("notes").innerHTML=[c.Note1,c.Note2].filter(Boolean).map(function(n){return "• "+esc(n)}).join("<br>")+(S.rs==="1"?"<br>• Reseller rates applied (printing only). Design charges extra.":"")}
document.addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(!b)return;var k=b.dataset.k,v=b.dataset.v;
  if(k=="ftog"){FOPEN=!FOPEN;render();return}
  if(b.classList.contains("off")){toast(k=="des"?"Design sirf "+num("DesignBelowQty",500)+" se kam cards par milta hai":why(model(),k,v),1);return}
  if(k=="reset"){var t=S.tab,r=S.rs;S=Object.assign({},DEF,{tab:t,rs:r})}else if(k=="rs"){if(S.rs!=="1"){rsAsk();return}S.rs="0"}else S[k]=v;
  render();if(k!="tab"&&k!="reset")toast(SUB)});
(function(){try{var c=JSON.parse(localStorage.getItem("jmd_rates2")||"null");if(c&&c.VisitingCards)DB=c}catch(e){}render();
 if(!API_URL)return;
 fetch(API_URL).then(function(r){return r.json()}).then(function(d){if(d&&d.VisitingCards&&d.VisitingCards.length){DB=d;try{localStorage.setItem("jmd_rates2",JSON.stringify(d))}catch(e){}render()}}).catch(function(){})})();
</script><div id="rsPin" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.55);align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:18px;padding:20px;width:100%;max-width:280px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)"><b style="font-size:15px">Reseller PIN</b><input id="rsIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="display:block;width:100%;margin:14px 0 6px;padding:11px;font-size:22px;letter-spacing:10px;text-align:center;border:1.5px solid #e5e7eb;border-radius:12px;outline:0"><div id="rsMsg" style="min-height:16px;font-size:12px;color:#dc2626"></div><div style="display:flex;gap:8px;margin-top:10px"><button id="rsNo" style="flex:1;padding:10px;border:1px solid #e5e7eb;background:#fff;border-radius:12px;font-weight:600;cursor:pointer">Cancel</button><button id="rsOk" style="flex:1;padding:10px;border:0;background:#a50044;color:#fff;border-radius:12px;font-weight:700;cursor:pointer">OK</button></div></div></div>
<script>
function rsH(p){var h=5381,s="jmdrs|"+p;for(var i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return String(h>>>0)}
var RS_HASH="1117197978";
function rsAsk(){var m=document.getElementById("rsPin"),i=document.getElementById("rsIn");document.getElementById("rsMsg").textContent="";i.value="";m.style.display="flex";setTimeout(function(){i.focus()},50)}
function rsClose(){document.getElementById("rsPin").style.display="none"}
function rsTry(){var i=document.getElementById("rsIn");if(rsH(i.value)===RS_HASH){rsClose();S.rs="1";render();toast("Reseller rates ON")}else{document.getElementById("rsMsg").textContent="Galat PIN";i.value=""}}
document.getElementById("rsOk").onclick=rsTry;document.getElementById("rsNo").onclick=rsClose;
document.getElementById("rsIn").addEventListener("input",function(){if(this.value.length===4)rsTry()});
document.getElementById("rsIn").addEventListener("keydown",function(e){if(e.key==="Enter")rsTry();if(e.key==="Escape")rsClose()});
</script>
